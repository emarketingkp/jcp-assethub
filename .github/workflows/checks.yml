name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run included mock tests
        run: |
          node tests/recognition.test.js
          node tests/backend-mock.test.js
      - name: Check frontend and backend syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in public/*.js; do
            node --check "$file"
          done
          node --check < apps-script/Code.gs
