name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Run unit and existing mock tests
        run: npm test
      - name: Check frontend and backend syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in public/*.js; do
            node --check "$file"
          done
          node --check < apps-script/Code.gs
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop browser regressions
        run: npm run test:browser
